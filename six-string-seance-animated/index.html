2,1005,42,33],"clip":"3.3px 0px 40.3px 0px 38.7px 33px 1.7px 33px"},{"w":"circle.","b":[709,1005,73,33],"clip":"3.3px 0px 71.8px 0px 70.2px 33px 1.7px 33px"}]},{"text":"Elvis takes over. Then Bobby and Elvis jam together.","kind":"b","y0":1040,"y1":1073,"words":[{"w":"Elvis","b":[204,1040,78,33],"clip":"10.1px 0px 76.1px 0px 67.9px 33px 1.9px 33px"},{"w":"takes","b":[270,1040,76,33],"clip":"10.1px 0px 74.1px 0px 65.9px 33px 1.9px 33px"},{"w":"over.","b":[334,1040,67,33],"clip":"10.1px 0px 65.6px 0px 57.4px 33px 1.9px 33px"},{"w":"Then","b":[390,1040,74,33],"clip":"9.6px 0px 72.1px 0px 63.9px 33px 1.4px 33px"},{"w":"Bobby","b":[452,1040,88,33],"clip":"10.1px 0px 86.6px 0px 78.4px 33px 1.9px 33px"},{"w":"and","b":[529,1040,59,33],"clip":"9.6px 0px 57.1px 0px 48.9px 33px 1.4px 33px"},{"w":"Elvis","b":[576,1040,74,33],"clip":"10.1px 0px 72.1px 0px 63.9px 33px 1.9px 33px"},{"w":"jam","b":[638,1040,60,33],"clip":"10.1px 0px 58.6px 0px 50.4px 33px 1.9px 33px"},{"w":"together.","b":[687,1040,111,33],"clip":"9.6px 0px 109.1px 0px 100.9px 33px 1.4px 33px"}]},{"text":"Stories follow, dirty or laundry-clean.","kind":"b","y0":1075,"y1":1108,"words":[{"w":"Stories","b":[286,1075,96,33],"clip":"14.2px 0px 94.7px 0px 82.3px 33px 1.8px 33px"},{"w":"follow,","b":[367,1075,98,33],"clip":"13.7px 0px 96.2px 0px 83.8px 33px 1.3px 33px"},{"w":"dirty","b":[449,1075,76,33],"clip":"14.2px 0px 74.7px 0px 62.3px 33px 1.8px 33px"},{"w":"or","b":[510,1075,43,33],"clip":"13.7px 0px 41.7px 0px 29.3px 33px 1.3px 33px"},{"w":"laundry-clean.","b":[538,1075,180,33],"clip":"13.7px 0px 178.2px 0px 165.8px 33px 1.3px 33px"}]},{"text":"Avant-garde B-grade pulp horror,","kind":"b","y0":1136,"y1":1170,"words":[{"w":"Avant-garde","b":[318,1136,157,34],"clip":"6.6px 0px 155.6px 0px 150.4px 34px 1.4px 34px"},{"w":"B-grade","b":[467,1136,104,34],"clip":"6.6px 0px 102.6px 0px 97.4px 34px 1.4px 34px"},{"w":"pulp","b":[563,1136,66,34],"clip":"6.6px 0px 64.6px 0px 59.4px 34px 1.4px 34px"},{"w":"horror,","b":[621,1136,87,34],"clip":"6.6px 0px 85.6px 0px 80.4px 34px 1.4px 34px"}]},{"text":"cheap fangs and all.","kind":"b","y0":1177,"y1":1211,"words":[{"w":"cheap","b":[392,1177,84,34],"clip":"13.0px 0px 82.4px 0px 70.6px 34px 1.0px 34px"},{"w":"fangs","b":[461,1177,84,34],"clip":"13.4px 0px 82.0px 0px 70.0px 34px 1.6px 34px"},{"w":"and","b":[530,1177,65,34],"clip":"13.0px 0px 63.4px 0px 51.6px 34px 1.0px 34px"},{"w":"all.","b":[580,1177,58,34],"clip":"13.4px 0px 56.0px 0px 44.0px 34px 1.6px 34px"}]},{"text":"Adults only.","kind":"adult","y0":1224,"y1":1260,"words":[{"w":"Adults","b":[426,1224,100,36],"clip":"1.6px 0px 96.2px 0px 98.8px 36px 4.4px 36px"},{"w":"only.","b":[521,1224,68,36],"clip":"1.2px 0px 63.6px 0px 66.4px 36px 3.8px 36px"}]},{"text":"Thursday 29 October","kind":"date","y0":1266,"y1":1308,"words":[{"w":"Thursday","b":[334,1266,176,42],"clip":"12.2px 0px 174.2px 0px 163.8px 42px 1.8px 42px"},{"w":"29","b":[496,1266,64,42],"clip":"12.2px 0px 62.2px 0px 51.8px 42px 1.8px 42px"},{"w":"October","b":[546,1266,149,42],"clip":"12.2px 0px 147.2px 0px 136.8px 42px 1.8px 42px"}]},{"text":"Halloween eve","kind":"date","y0":1308,"y1":1340,"words":[{"w":"Halloween","b":[421,1308,144,32],"clip":"8.6px 0px 142.1px 0px 134.9px 32px 1.4px 32px"},{"w":"eve","b":[554,1308,55,32],"clip":"9.1px 0px 53.6px 0px 46.4px 32px 1.9px 32px"}]},{"text":"Saltamontes, Anjuna","kind":"date","y0":1346,"y1":1400,"words":[{"w":"Saltamontes,","b":[328,1346,244,54],"clip":"24.5px 0px 242.5px 0px 219.5px 54px 1.5px 54px"},{"w":"Anjuna","b":[546,1346,160,54],"clip":"24.5px 0px 158.5px 0px 135.5px 54px 1.5px 54px"}]}];

const stage = document.getElementById('stage'), halo = document.getElementById('halo');
function fit() {
  const k = Math.min(innerWidth / 1024, innerHeight / 1536);
  document.documentElement.style.setProperty('--k', k);
}
addEventListener('resize', fit); fit();

// build one element per word, cut out of the card's own lettering
const words = [];
for (const line of LINES) {
  for (const w of line.words) {
    const [x, y, wd, ht] = w.b;
    const el = document.createElement('div');
    el.className = 'w' + (line.kind === 'title' ? ' title' : '');
    el.style.cssText = `left:${x}px;top:${y}px;width:${wd}px;height:${ht}px`;
    const ink = document.createElement('div');
    ink.className = 'ink';
    ink.style.backgroundPosition = `${-x}px ${-y}px`;
    ink.style.clipPath = `polygon(${w.clip.split(' ').reduce((a, v, i) => a + (i % 2 ? ' ' : (i ? ',' : '')) + v, '')})`;
    el.appendChild(ink);
    stage.appendChild(el);
    words.push({ el, line, ink });
  }
}

const ease = 'cubic-bezier(.16,.84,.24,1)';
const G = (a, b, c, d, e, f) => `drop-shadow(0 0 ${a}px rgba(255,226,150,${b})) drop-shadow(0 0 ${c}px rgba(255,190,80,${d})) drop-shadow(0 0 ${e}px rgba(255,160,50,${f}))`;
const GLOW = [{ filter: G(2, .85, 9, .65, 22, .4) }, { filter: G(3, 1, 16, .9, 42, .7) }, { filter: G(2, .85, 9, .65, 22, .4) }];
let anims = [], timers = [];
function reset() {
  anims.forEach(a => a.cancel()); timers.forEach(clearTimeout);
  anims = []; timers = [];
  words.forEach(w => { w.el.style.opacity = 0; });
  halo.style.opacity = 0;
}
function zoomIn(el, at, opt) {
  const { from = 3.2, dur = 900, blur = 8, roll = -55 } = opt || {};
  const a = el.animate([
    { opacity: 0, transform: `scale(${from}) rotateX(${roll}deg)`, filter: `blur(${blur}px)` },
    { opacity: 1, offset: .45 },
    { opacity: 1, transform: 'scale(1) rotateX(0deg)', filter: 'blur(0px)' }
  ], { duration: dur, delay: at, easing: ease, fill: 'both' });
  a.onfinish = () => { el.style.opacity = 1; };
  anims.push(a);
  return at + dur;
}
function play() {
  reset();
  document.body.classList.add('rec');
  let t = 500;
  let lastLine = null;
  for (const w of words) {
    const k = w.line.kind;
    if (w.line !== lastLine) {             // a new line starts
      if (lastLine) t += k === 'title' ? 500 : k === 'date' || k === 'adult' ? 420 : 220;
      lastLine = w.line;
    }
    if (k === 'pre') { zoomIn(w.ink.parentNode, t, { from: 2.2, dur: 1100, blur: 4, roll: 0 }); t += 700; }
    else if (k === 'title') {
      const el = w.el;
      // the inner .ink zooms, so the halo filter on .w stays steady while it lands
      el.style.opacity = 1;
      const a = w.ink.animate([
        { opacity: 0, transform: 'scale(4) rotateX(-40deg)', filter: 'blur(14px)' },
        { opacity: 1, offset: .5 },
        { opacity: 1, transform: 'scale(1) rotateX(0)', filter: 'blur(0)' }
      ], { duration: 1500, delay: t, easing: ease, fill: 'both' });
      anims.push(a);
      anims.push(el.animate(GLOW, { duration: 3200, delay: t + 900, iterations: Infinity, easing: 'ease-in-out' }));
      t += 900;
    }
    else if (k === 'date') { zoomIn(w.el, t, { from: 3.6, dur: 1000, blur: 10 }); t += 260; }
    else if (k === 'adult') { zoomIn(w.el, t, { from: 3, dur: 900 }); t += 220; }
    else { zoomIn(w.el, t, { dur: 820 }); t += 100; }
    if (k === 'title' && w.line.text === 'Séance') {
      const at = t + 300;
      anims.push(halo.animate([{ opacity: 0 }, { opacity: .75 }], { duration: 1200, delay: at - 400, fill: 'forwards' }));
      anims.push(halo.animate([{ opacity: .75, transform: 'scale(1)' }, { opacity: 1, transform: 'scale(1.06)' }, { opacity: .75, transform: 'scale(1)' }],
        { duration: 3200, delay: at + 800, iterations: Infinity, easing: 'ease-in-out' }));
      t += 600;
    }
  }
}
// titles need the .w visible for their glow but the ink hidden until it zooms
for (const w of words) if (w.line.kind === 'title') w.ink.style.opacity = 0;
const _reset = reset;
reset = function () { _reset(); for (const w of words) if (w.line.kind === 'title') w.ink.style.opacity = 0; };

// frame-exact export: window.seek(ms) after window.prepare()
window.prepare = () => { play(); anims.forEach(a => a.pause()); };
window.seek = ms => anims.forEach(a => { a.currentTime = ms; });
window.totalMs = () => Math.max(...anims.map(a => { const t = a.effect.getComputedTiming(); return t.endTime === Infinity ? 0 : t.endTime; }));

addEventListener('click', play);
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'r' || e.key === 'Enter') play(); });
Promise.all([...document.images].map(i => i.decode().catch(() => {}))).then(() => {
  const im = new Image(); im.src = 'card-text.png';
  return im.decode();
}).then(() => { if (new URLSearchParams(location.search).has('auto')) play(); });
</script>
